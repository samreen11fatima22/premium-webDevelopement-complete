<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <table border="red">
        <caption>Food Menu</caption>
        <!-- table header -->
        <thead>
            <tr>
            <th colspan="2">Item</th>
            <th>Price</th>
        </tr>
        </thead>
<!-- table body -->
        <tbody>
            <tr>
            <td>Frooti</td>
            <td>13</td>
        </tr>
        <tr>
            <td>Samosa</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Kachori</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Chips</td>
            <td>50</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
