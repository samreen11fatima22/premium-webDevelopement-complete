<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sub & sup</title>
</head>
<body>
    <!-- Subscript -->
    <p>Water Formula:</p>
    <h1>H<sub>2</sub>O</h1>
    <p>Glucose Formula:</p>
    <h1>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></h1>

    <!-- superscript -->
     <p>Math Equation:</p>
     <h2>(a+b)<sup>2</sup>=a<sup>2</sup>+2ab+b<sup>2</sup></h2>
</body>
</html>
