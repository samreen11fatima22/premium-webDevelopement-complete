<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colspan & rowspan</title>
</head>
<body>
    <table>
        <caption>
            <tr>
                <th rowspan="2">Items</th>
                <th colspan="2">Price</th>
            </tr>
            <tr>
                <th>RS</th>
            </tr>
        </caption>
    </table>
</body>
</html>
