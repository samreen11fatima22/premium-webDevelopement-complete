<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>google search-q</title>
</head>
<body>
    <!-- name or action ko link krvana k servaer kis data ko la  -->
    <form action="https://www.google.com/search?q=apple&oq">

        <label for="search">Search :
        
        </label>
        <input type="text" name="q" placeholder="search in google" id="search">
        <br>
        <input type="submit">
    </form>
</body>
</html>
