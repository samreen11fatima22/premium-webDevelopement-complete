<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button>Hello</button>
    <form action="/server" method="post">
      <button>Hello</button>
      <br />
      <label>
        Username
        <input type="text" />
      </label>
      <br />
      <label>
        Password
        <input type="password" />
      </label>
      <br />
      <label>
        Number
        <input type="number" />
      </label>
      <br />
      <label>
        Telephone
        <input type="tel" />
      </label>
      <br />
      <label>
        Color
        <input type="color" />
      </label>
      <br />
      <label>
        Time
        <input type="time" />
      </label>
      <br />
      <label>
        date
        <input type="date" />
      </label>
      <br />
      <!-- classicacal approach for writing label 
       we connect lable and input by using for in lable and id in input =both same -->
      <label for="username">username :</label>
      <input type="text" id="username" />
      <div>
        <label for="age">Enter Age :</label>
        <input type="number" placeholder="enter your age" id="age" />
      </div>
      <!-- button -->
      <!-- form k ander jo b button jhan p b hu iska default behaviour submit krvana hota ha  -->
      <button>Submit</button>
      <br />
      <button type="reset">Reset</button>
      <br />
      <button type="button">hello</button>
      <input type="submit" value="  Submit form " />
      <br />
      <input type="button" value="click me" />
      <!-- reset submit input type m button p kia show hoga likhna ni padega -->
      <input type="reset" />
    </form>
    <h2>Name Attribute</h2>
    <form action="/server">
      <label for="username1">Enter Name :</label>
     <input type="text" id="username1" name="username">
      <label for="password">Password :</label>
      <input type="password" placeholder="enter password" id="password"/>
      <br>
      <input type="submit">
      <hr>
    </form>
    <!-- example real life -->
     <form action="https://www.youtube.com/results">
      <input type="text" name="search_query">
      <button>Search</button>
     </form>
     
  </body>
</html>
