<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opacity</title>
    <style>
        h1{
            background-color: rgba(112, 159, 245, 0.5);
            color: rgba(22, 13, 13 ,1);
            /* opacity is overall property of container applies on all while alpha channel is relative to istelf color of element like rgba applies only where it is added with color */
        }
    </style>
</head>
<body>
    <h1>Random heading</h1>
</body>
</html>
